name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            ext: .tar.gz
          - goos: darwin
            goarch: arm64
            ext: .tar.gz
          - goos: linux
            goarch: amd64
            ext: .tar.gz
          - goos: linux
            goarch: arm64
            ext: .tar.gz
          - goos: windows
            goarch: amd64
            ext: .zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o uulink${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/uulink

      - name: Package
        run: |
          NAME="uulink-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$NAME"
          mv uulink* "$NAME/"
          cp config.example.json README.md "$NAME/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd . && zip -r "$NAME.zip" "$NAME")
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uulink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: uulink-*.zip

      - name: Upload artifact (tar)
        if: matrix.goos != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: uulink-${{ matrix.goos }}-${{ matrix.goarch }}-tar
          path: uulink-*.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uulink-*.zip
            uulink-*.tar.gz
          generate_release_notes: true
