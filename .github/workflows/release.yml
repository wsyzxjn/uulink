name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Module tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Test
        run: go test -count=1 ./...

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            ext: .tar.gz
          - goos: darwin
            goarch: arm64
            ext: .tar.gz
          - goos: linux
            goarch: amd64
            ext: .tar.gz
          - goos: linux
            goarch: arm64
            ext: .tar.gz
          - goos: windows
            goarch: amd64
            ext: .zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o uulink${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/uulink

      - name: Package
        run: |
          NAME="uulink-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$NAME"
          mv "uulink${{ matrix.goos == 'windows' && '.exe' || '' }}" "$NAME/"
          cp config.example.json README.md "$NAME/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd . && zip -r "$NAME.zip" "$NAME")
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - name: Upload artifact
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: uulink-${{ matrix.goos }}-${{ matrix.goarch }}
          path: uulink-*.zip

      - name: Upload artifact (tar)
        if: matrix.goos != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: uulink-${{ matrix.goos }}-${{ matrix.goarch }}-tar
          path: uulink-*.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uulink-*.zip
            uulink-*.tar.gz
          generate_release_notes: true

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests only validate that the image still builds.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :edge, v1.2.3 -> :1.2.3, :1.2, :1, :latest, every build -> :sha-xxxxxxx
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=ref,event=pr
            type=sha,format=short

      # No QEMU setup: the Dockerfile cross-compiles from the runner's native
      # platform, so arm64 images build at amd64 speed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the GHCR package listing to the two real platforms instead of
          # adding unknown/unknown provenance entries.
          provenance: false
